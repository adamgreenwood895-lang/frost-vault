<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FROST | VAULT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Global background remains visible -->
    <div class="bg-image"></div>

    <main id="app">
        <!-- LANDING -->
        <section id="view-landing" class="view active">
            <div id="orb-trigger" class="orb-hitbox">
                <div class="orb-glow"></div>
                <div class="orb-content">
                    <span id="voice-label">FROST</span>
                    <div id="cmd-display">AWAIT_COMMAND</div>
                </div>
            </div>
        </section>

        <!-- PRODUCTS -->
        <section id="view-products" class="view">
            <div class="mist-overlay"></div>
            <header class="product-header">
                <h1 class="glitch-text" id="cat-title">COLLECTION</h1>
                <p style="font-size:8px; opacity:0.5; letter-spacing:2px;">SYSTEM ACTIVE // TEMP -40°C</p>
            </header>
            <div id="product-grid" class="grid"></div>
            <footer class="cmd-bar">
                <button onclick="changeView('landing')" class="back-btn">REBOOT_SYSTEM</button>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
