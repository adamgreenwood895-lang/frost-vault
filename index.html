<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FROST | VAULT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;900&display=swap" rel="stylesheet">
</head>
<body>

    <main id="app">
        <!-- LANDING LAYER -->
        <section id="view-landing" class="view active">
            <div class="bg-image"></div>
            <div id="orb-trigger" class="orb-hitbox">
                <div class="orb-glow"></div>
                <div class="orb-ui">
                    <span id="voice-label">FROST</span>
                    <div id="cmd-display">AWAIT_COMMAND</div>
                </div>
            </div>
        </section>

        <!-- PRODUCT LAYER -->
        <section id="view-products" class="view">
            <div class="mist-overlay"></div>
            <header class="product-header">
                <div class="header-line"></div>
                <h1 class="glitch-text" id="cat-title">COLLECTION</h1>
                <p class="system-status">SYSTEM: ACTIVE // TEMP: -40°C</p>
            </header>
            <div id="product-grid" class="grid"></div>
            <button onclick="changeView('landing')" class="back-btn">REBOOT_SYSTEM</button>
        </section>

        <!-- CHECKOUT LAYER -->
        <section id="view-checkout" class="view">
            <div class="checkout-container">
                <h2 class="glitch-text">TRANSACTION_INIT</h2>
                <div id="checkout-card" class="product-card" style="max-width: 300px; margin: 20px auto;"></div>
                <button class="select-btn" onclick="startTracking()" style="max-width: 200px;">AUTHORIZE_PAYMENT</button>
                <div id="tracking-ui" style="display:none; width: 100%; margin-top: 20px;">
                    <div class="track-line"><div id="trackFill" class="track-fill"></div></div>
                    <p id="trackStatus" class="system-status">ENCRYPTING...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
